spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

wiser.api-key=${WISER_API_KEY:}
wiser.cors.allowed-origins=${WISER_CORS_ALLOWED_ORIGINS:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:wiser}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
