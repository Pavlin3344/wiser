spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Time-series tables (FWI, weather, air quality) live in a separate TimescaleDB.
timescale.datasource.url=${TIMESCALE_URL:jdbc:postgresql://localhost:5433/wiser_timeseries}
timescale.datasource.username=${TIMESCALE_USER:wiser}
timescale.datasource.password=${POSTGRES_PASSWORD}

# How long a FIRMS detection counts as an active fire. Nothing expires or deletes a
# detection, so this window is the only thing separating "burning now" from "burned
# out days ago". FIRMS is polled for the last 24 hours; both satellites revisit
# roughly twice a day, so a fire still alight keeps being re-reported.
wiser.active-fire-window-hours=${WISER_ACTIVE_FIRE_WINDOW_HOURS:24}

wiser.api-key=${WISER_API_KEY:}
wiser.cors.allowed-origins=${WISER_CORS_ALLOWED_ORIGINS:}

# Roads running within this distance of an active fire are excluded from evacuation
# routing, and assembly points inside it are not offered as destinations.
evacuation.fire-buffer-meters=${EVACUATION_FIRE_BUFFER_METERS:1000}
evacuation.max-destinations=${EVACUATION_MAX_DESTINATIONS:3}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:wiser}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Log shipping to the Hetzner ELK stack. Unset under Compose - filebeat reads stdout from
# the Docker json files there, so nothing needs sending. Set on Container Apps, where no
# such host exists and the process has to ship its own logs. See logback-spring.xml.
wiser.logstash.host=${LOGSTASH_HOST:}
wiser.logstash.port=${LOGSTASH_PORT:5045}
