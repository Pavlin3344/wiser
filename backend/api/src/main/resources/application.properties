spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Time-series tables (FWI, weather, air quality) live in a separate TimescaleDB.
timescale.datasource.url=${TIMESCALE_URL:jdbc:postgresql://localhost:5433/wiser_timeseries}
timescale.datasource.username=${TIMESCALE_USER:wiser}
timescale.datasource.password=${POSTGRES_PASSWORD}

wiser.api-key=${WISER_API_KEY:}
wiser.cors.allowed-origins=${WISER_CORS_ALLOWED_ORIGINS:}

# Roads running within this distance of an active fire are excluded from evacuation
# routing, and assembly points inside it are not offered as destinations.
evacuation.fire-buffer-meters=${EVACUATION_FIRE_BUFFER_METERS:1000}
evacuation.max-destinations=${EVACUATION_MAX_DESTINATIONS:3}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:wiser}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
