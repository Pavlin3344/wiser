spring.application.name=ingestion
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

server.port=8081

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:wiser}

# Time-series tables (FWI, weather, air quality) live in a separate TimescaleDB.
timescale.datasource.url=${TIMESCALE_URL:jdbc:postgresql://localhost:5433/wiser_timeseries}
timescale.datasource.username=${TIMESCALE_USER:wiser}
timescale.datasource.password=${POSTGRES_PASSWORD}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}

# FIRMS_MAP_KEY: register (free) at https://firms.modaps.eosdis.nasa.gov/api/area/
firms.map-key=${FIRMS_MAP_KEY:REPLACE_ME_REGISTER_AT_FIRMS}
firms.area=22.3,41.2,28.7,44.2

# Copernicus Data Space (Sentinel-2): register at https://dataspace.copernicus.eu/
copernicus.client-id=${COPERNICUS_CLIENT_ID:REPLACE_ME_REGISTER_AT_COPERNICUS}
copernicus.client-secret=${COPERNICUS_CLIENT_SECRET:REPLACE_ME_REGISTER_AT_COPERNICUS}

wiser.api-key=${WISER_API_KEY:}

# Overpass import is heavy and OSM road/infrastructure data changes rarely, so the
# monthly run is opt-in rather than on by default.
osm.import.scheduled=${OSM_IMPORT_SCHEDULED:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
