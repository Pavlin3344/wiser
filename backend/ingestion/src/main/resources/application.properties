spring.application.name=ingestion
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

server.port=8081

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=wiser

minio.endpoint=http://localhost:9000
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}

# FIRMS_MAP_KEY: register (free) at https://firms.modaps.eosdis.nasa.gov/api/area/
firms.map-key=${FIRMS_MAP_KEY:REPLACE_ME_REGISTER_AT_FIRMS}
firms.area=22.3,41.2,28.7,44.2

# Copernicus Data Space (Sentinel-2): register at https://dataspace.copernicus.eu/
copernicus.client-id=${COPERNICUS_CLIENT_ID:REPLACE_ME_REGISTER_AT_COPERNICUS}
copernicus.client-secret=${COPERNICUS_CLIENT_SECRET:REPLACE_ME_REGISTER_AT_COPERNICUS}
