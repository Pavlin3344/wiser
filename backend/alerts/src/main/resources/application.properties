spring.application.name=alerts
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

server.port=8082

alerts.proximity-meters=5000

wiser.api-key=${WISER_API_KEY:}

# Notifications stay off until SMTP credentials are supplied, so the service runs
# unchanged without them.
alerts.notify.enabled=${ALERTS_NOTIFY_ENABLED:false}
alerts.notify.to=${ALERTS_NOTIFY_TO:}
alerts.notify.from=${ALERTS_NOTIFY_FROM:wiser@wisertech.com}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Log shipping to the Hetzner ELK stack. Unset under Compose - filebeat reads stdout from
# the Docker json files there, so nothing needs sending. Set on Container Apps, where no
# such host exists and the process has to ship its own logs. See logback-spring.xml.
wiser.logstash.host=${LOGSTASH_HOST:}
wiser.logstash.port=${LOGSTASH_PORT:5045}

# The name this process's logs are filed under in Kibana. One image runs under several
# names on Azure - wiser-ingestion is the same jar for all five ingest jobs - so
# Container Apps sets WISER_LOG_SERVICE to the job's key. Unset under Compose, where one
# service is one name and nothing needs saying.
wiser.log-service=${WISER_LOG_SERVICE:alerts}
