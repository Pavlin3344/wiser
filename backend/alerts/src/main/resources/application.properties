spring.application.name=alerts
spring.datasource.url=jdbc:postgresql://localhost:5432/wiser
spring.datasource.username=wiser
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

server.port=8082

alerts.proximity-meters=5000

wiser.api-key=${WISER_API_KEY:}

# Notifications stay off until SMTP credentials are supplied, so the service runs
# unchanged without them.
alerts.notify.enabled=${ALERTS_NOTIFY_ENABLED:false}
alerts.notify.to=${ALERTS_NOTIFY_TO:}
alerts.notify.from=${ALERTS_NOTIFY_FROM:wiser@wisertech.com}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
