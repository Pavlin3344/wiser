name: CI
permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-infra:
    name: Validate infrastructure configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker compose v2 е вграден в ubuntu runner-ите — без apt install
      - name: Validate docker-compose files
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose.dev.yml config --quiet
          # Jobs-овете се валидират слети с базата, защото само така се пускат - сами по
          # себе си нямат мрежа и зависимости. Без този ред грешка в тях се вижда чак на
          # сървъра, в момента, в който някой пусне job.
          docker compose -f infra/docker/docker-compose.yml \
                         -f infra/docker/docker-compose.jobs.yml config --quiet
          echo "compose files are valid"

      # Валидираме със същите версии, които вървят на сървъра (не :latest)
      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/prometheus:/etc/prometheus:ro \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml

      # Всички файлове с правила, не само infrastructure.yml — иначе нов файл влиза
      # невалидиран и Prometheus го отхвърля чак на сървъра.
      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/prometheus:/etc/prometheus:ro \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.53.0 \
            check rules /etc/prometheus/rules/infrastructure.yml \
                        /etc/prometheus/rules/backend.yml \
                        /etc/prometheus/rules/data-processing.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/alertmanager:/etc/alertmanager:ro \
            --entrypoint amtool \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      # Prometheus и Alertmanager се валидираха, ELK — не. Затова счупен pipeline се
      # виждаше едва като Logstash boot loop на сървъра, а деплоят минаваше зелен:
      # контейнерът нямаше healthcheck, а gate-ът филтрира по "health=unhealthy".
      # Логовете спряха на 2026-08-20 и никой не разбра три месеца.
      - name: Validate Logstash pipeline
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/logstash/pipeline:/usr/share/logstash/pipeline:ro \
            -e "LS_JAVA_OPTS=-Xms256m -Xmx256m" \
            docker.elastic.co/logstash/logstash:8.13.0 \
            logstash --config.test_and_exit --path.settings /usr/share/logstash/config

      - name: Validate Filebeat config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro \
            docker.elastic.co/beats/filebeat:8.13.0 \
            --strict.perms=false test config

      # Шаблонът и ILM политиката се качват с curl, не от Compose, така че единственото
      # място, където синтаксисът им може да се хване преди сървъра, е тук.
      - name: Validate Elasticsearch template and ILM JSON
        run: |
          for f in infra/docker/elasticsearch/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "$f is valid JSON"
          done
  
  # Не е в `needs` на deploy: Terraform описва Azure, а deploy пипа Hetzner. Счупен .tf
  # не бива да спира деплой на продукцията, но и не бива да се открива чак при apply.
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, envs/prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Check formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      # -backend=false: валидацията не иска нито state, нито Azure креденшъли.
      - name: Init without backend
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform validate

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  validate-backend:
    name: Validate backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, alerts, ingestion]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      # api and ingestion tests use Testcontainers, which needs the Docker daemon
      # the ubuntu runner already provides.
      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: ./mvnw -B test

  validate-shared-data:
    name: Validate shared data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Очертанието на България живее на две места: картата реже детекциите по копието
      # на фронтенда, risk zones job-ът реже зоните по своето. Разминат ли се, зоните и
      # детекциите спират да съвпадат по границата - тихо и само на око.
      - name: Bulgaria border stays identical in both copies
        run: |
          if ! cmp -s data/processing/risk_zones/bulgaria_border.json frontend/src/data/bulgaria-border.json; then
            echo "Двете копия на границата се разминаха:"
            diff <(head -c 400 data/processing/risk_zones/bulgaria_border.json) \
                 <(head -c 400 frontend/src/data/bulgaria-border.json) || true
            exit 1
          fi
          echo "Border files are identical - OK"

  validate-data-processing:
    name: Validate data processing workers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [fwi, ndvi, risk_zones, dnbr, metrics]
    steps:
      - uses: actions/checkout@v7

      # Същата версия като в `data/processing/Dockerfile` (python:3.12-slim) — тестът
      # трябва да върви на това, което ще се деплойне, а не на локалния venv (3.11).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/processing/${{ matrix.worker }}/requirements.txt

      - name: Install dependencies
        working-directory: data/processing/${{ matrix.worker }}
        run: pip install -r requirements.txt -r ../requirements-dev.txt

      # Тестовете не пипат база, RabbitMQ или MinIO — не им трябва стек
      - name: Run tests
        working-directory: data/processing/${{ matrix.worker }}
        run: python -m pytest -q

  validate-sql:
    name: Validate SQL schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SQL files exist and are non-empty
        run: |
          test -s db/postgres/migrations/V1__init.sql || (echo "PostgreSQL schema is empty!" && exit 1)
          test -s db/timescale/hypertables/V1__init.sql || (echo "TimescaleDB schema is empty!" && exit 1)
          echo "SQL files OK"

      - name: Basic SQL syntax check
        run: |
          grep -l "CREATE TABLE" db/postgres/migrations/V1__init.sql || (echo "No CREATE TABLE found" && exit 1)
          grep -l "create_hypertable" db/timescale/hypertables/V1__init.sql || (echo "No hypertable found" && exit 1)
          echo "SQL syntax check OK"

      # Flyway изисква V<число>__<описание>.sql — иначе мълчаливо пропуска файла
      - name: Check Flyway migration naming
        run: |
          bad=$(find db/postgres/migrations db/timescale/hypertables -name "*.sql" ! -regex '.*/V[0-9]+__[A-Za-z0-9_]+\.sql' || true)
          if [ -n "$bad" ]; then
            echo "Files not matching Flyway naming (V1__name.sql): $bad"
            exit 1
          fi
          echo "Migration naming OK"

  security-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure .env is not tracked
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo ".env file is tracked by git!"
            exit 1
          fi
          echo ".env is not tracked - OK"

  deploy:
    name: Deploy to Hetzner
    needs: [validate-infra, validate-sql, validate-frontend, validate-backend, validate-data-processing, validate-shared-data, security-scan]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Един deploy наведнъж — при бързи последователни push-ове се редят на опашка
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Reset към валидирания commit, не към movable origin/main
      - name: Sync repo to validated commit
        working-directory: /home/pavlin/wiser-repo
        run: |
          git fetch origin main
          git reset --hard ${{ github.sha }}

      # Каквото е минало в профил "full" вече не е част от активната конфигурация, но
      # контейнерът му продължава да върви от предишния деплой. Дали --remove-orphans
      # пипа профилирани услуги се е променяло между версиите на Compose, а тук разликата
      # е дали машината наистина освобождава паметта - затова ги спираме поименно.
      # Идемпотентно: списъкът се смята от самия compose файл, не е зашит, и втори пробег
      # не намира какво да спре. Volume-ите остават - `rm -s` маха контейнера, не данните.
      - name: Stop services that now run on Azure
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          active=$(docker compose config --services)
          for svc in $(COMPOSE_PROFILES=full docker compose config --services); do
            if ! echo "$active" | grep -qx "$svc"; then
              COMPOSE_PROFILES=full docker compose rm -sf "$svc" 2>/dev/null || true
            fi
          done
          echo "Profiled-out services stopped"

      - name: Apply changes
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          docker compose up -d --build --remove-orphans
          echo "Deployment complete"

      # Prometheus and Alertmanager read their config once, at container start, and
      # their config files are bind mounts - so `up -d` leaves them running on whatever
      # they loaded last time and a config-only change never takes effect. Four scrape
      # targets (the three backend services and the data-processing exporter) had been
      # committed for a while and were still not being scraped for exactly this reason.
      # SIGHUP reloads in place, without dropping the series they already hold.
      - name: Reload Prometheus and Alertmanager config
        run: |
          docker kill --signal=HUP wiser-prometheus
          docker kill --signal=HUP wiser-alertmanager
          echo "Config reloaded"

      # config.reload.automatic в logstash.yml прави промените в pipeline-а живи, но
      # самия logstash.yml Logstash чете само при старт - а той е bind mount, тоест
      # `up -d` не пресъздава контейнера и новите настройки не влизат в сила. Маркерът
      # държи хеша на последно заредения файл: при първо пускане го няма и контейнерът
      # се пресъздава (което е точно каквото трябва, за да влезе самият auto-reload),
      # после мълчи, докато файлът не се смени. Рестарт при всеки деплой би струвал
      # деветдесет секунди, в които входът от Azure е затворен.
      - name: Recreate Logstash when its settings file changed
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          marker="$HOME/.wiser-logstash-yml.sha"
          current=$(sha256sum logstash/config/logstash.yml | cut -d' ' -f1)
          if [ "$(cat "$marker" 2>/dev/null || true)" != "$current" ]; then
            docker compose up -d --force-recreate logstash
            echo "$current" > "$marker"
            echo "Logstash recreated: its settings file changed"
          else
            echo "logstash.yml unchanged; the pipeline reloads on its own"
          fi

      # Grafana чете provisioning/datasources само при старт (таблата ги следи на живо,
      # datasource-ите - не). Bind mount + `up -d` без промяна в дефиницията значи, че
      # поправен datasource остава на диска, а работещият е старият - същият капан като
      # logstash.yml по-горе, същото решение: маркер с хеша, рестарт само при промяна.
      - name: Restart Grafana when its datasources changed
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          marker="$HOME/.wiser-grafana-datasources.sha"
          current=$(cat grafana/provisioning/datasources/*.yml | sha256sum | cut -d' ' -f1)
          if [ "$(cat "$marker" 2>/dev/null || true)" != "$current" ]; then
            docker restart wiser-grafana
            echo "$current" > "$marker"
            echo "Grafana restarted: a datasource file changed"
          else
            echo "datasources unchanged; dashboards reload on their own"
          fi

      - name: Verify container health
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          sleep 30
          unhealthy=$(docker ps --filter "health=unhealthy" --format '{{.Names}}')
          if [ -n "$unhealthy" ]; then
            echo "Unhealthy containers after deploy: $unhealthy"
            docker ps --format "table {{.Names}}\t{{.Status}}"
            exit 1
          fi
          failed_migrations=$(docker ps -a --filter "name=wiser-flyway" --filter "status=exited" --format '{{.Names}} {{.Status}}' | grep -v "Exited (0)" || true)
          if [ -n "$failed_migrations" ]; then
            echo "Flyway migration failed: $failed_migrations"
            docker logs wiser-flyway-postgres --tail 50 || true
            docker logs wiser-flyway-timescale --tail 50 || true
            exit 1
          fi
          docker ps --format "table {{.Names}}\t{{.Status}}"

      # Frontend build-овете трупат стари image-и по диска
      - name: Prune dangling images
        run: docker image prune -f

  # Azure, паралелно на Hetzner: образите се качват в ACR, за да може `terraform apply`
  # да ги посочи по таг. Не е в `needs` на deploy и deploy не е в неговия - двата облака
  # се деплойват независимо, и счупен Azure не бива да спира продукцията.
  #
  # Само push. `terraform apply` се пуска ръчно, защото иска и remote state, и петте
  # тайни от terraform.tfvars - нито едното още го няма в CI.
  azure-images:
    name: Push images to ACR
    needs: [validate-infra, validate-sql, validate-frontend, validate-backend, validate-data-processing, validate-shared-data, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      # Федерираният токен към Azure. Без него azure/login няма какво да размени за
      # достъп и гърми с AADSTS700016 - това е цялата разлика спрямо client secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # api_base_url: the browser calls api directly on Azure now (nginx proxying
          # between the two Container Apps proved unreliable - see the fix commits and
          # project_azure_demo_setup memory). Baked in at build time; set the
          # AZURE_API_BASE_URL repo variable to api's current public URL, and rebuild
          # after any environment recreation changes that URL's domain suffix.
          - { image: wiser-frontend,           context: frontend, api_base_url: true }
          - { image: wiser-api,                context: backend/api }
          - { image: wiser-alerts,             context: backend/alerts }
          - { image: wiser-ingestion,          context: backend/ingestion }
          # Един Dockerfile за всички Python worker-и, WORKER избира кой се пакетира.
          # Имената тук трябва да съвпадат с тези в modules/container-apps/variables.tf,
          # иначе apply-ът сочи към таг, който CI никога не е качвал.
          - { image: wiser-worker-fwi,         context: data/processing, worker: fwi }
          - { image: wiser-worker-ndvi,        context: data/processing, worker: ndvi }
          - { image: wiser-worker-dnbr,        context: data/processing, worker: dnbr }
          # risk-zones runs as a Container Apps *job* (job.py, exits when done), not the
          # long-lived queue-consumer loop the other workers use (worker.py) - matches
          # the ENTRYPOINT_FILE build arg docker-compose.yml passes for the same service.
          - { image: wiser-worker-risk-zones,  context: data/processing, worker: risk_zones, entrypoint_file: job.py }
          # fuel is the same story as risk-zones above: a one-shot loader (load_fuel.py),
          # not a queue consumer, so it has no worker.py for the Dockerfile's default
          # entrypoint to find. Missing here, the image built fine and then died on every
          # start with "can't open file '/app/data/processing/fuel/worker.py'". Matches
          # the build arg docker-compose.jobs.yml passes for the same job.
          - { image: wiser-worker-fuel,        context: data/processing, worker: fuel, entrypoint_file: load_fuel.py }
          # Third worker with its own entrypoint, after risk-zones and fuel. The image built
          # without this and then died on every start with "can't open file
          # metrics/worker.py" - which is why data-metrics has never once run on Azure, and
          # why every wiser_data_* metric on the Grafana dashboards came from the Hetzner
          # copy. The Dockerfile now fails the build rather than letting this reach runtime.
          - { image: wiser-data-metrics,       context: data/processing, worker: metrics, entrypoint_file: exporter.py }
          # Not an application - the osm2pgrouting import, packaged so it can run as a job
          # inside the VNet. It used to be a list of docker commands in a README aimed at
          # `docker exec wiser-postgres` on a network called docker_default; both went away
          # with the migration, and `roads` has been empty on Azure ever since. Its own
          # base image (pgrouting-extra), so no WORKER build arg applies.
          - { image: wiser-roads-import,       context: db/postgres/scripts }
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Името на регистъра носи случаен суфикс (envs/prod/main.tf:119), затова се открива
      # по време на изпълнение вместо да се записва тук и да се разминава след re-apply.
      - name: Discover the registry
        id: acr
        run: |
          server=$(az acr list -g rg-wiser-prod --query "[0].loginServer" -o tsv)
          if [ -z "$server" ]; then
            echo "Няма ACR в rg-wiser-prod. Пусни terraform apply веднъж преди този job."
            exit 1
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          az acr login --name "${server%%.*}"

      # Тагът е късото SHA, същият формат като image_tag в terraform.tfvars.example.
      # Нарочно без :latest - подвижен таг не се връща назад, а точно това ни трябва
      # при демо, което може да се наложи да се откачи на предишна ревизия.
      - name: Build and push
        run: |
          tag=${GITHUB_SHA::7}
          ref="${{ steps.acr.outputs.server }}/${{ matrix.image }}"
          docker build \
            ${{ matrix.worker && format('--build-arg WORKER={0}', matrix.worker) || '' }} \
            ${{ matrix.entrypoint_file && format('--build-arg ENTRYPOINT_FILE={0}', matrix.entrypoint_file) || '' }} \
            ${{ matrix.api_base_url && format('--build-arg VITE_API_BASE_URL={0}', vars.AZURE_API_BASE_URL) || '' }} \
            -t "$ref:$tag" \
            "${{ matrix.context }}"
          docker push "$ref:$tag"
          echo "Pushed $ref:$tag"
