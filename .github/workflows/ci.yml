name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-infra:
    name: Validate infrastructure configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Validate docker-compose.yml
        run: |
          docker-compose -f infra/docker/docker-compose.yml config --quiet
          echo "docker-compose.yml is valid"

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/prometheus:/etc/prometheus:ro \
            --entrypoint /bin/promtool \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/prometheus:/etc/prometheus:ro \
            --entrypoint /bin/promtool \
            prom/prometheus:latest \
            check rules /etc/prometheus/rules/infrastructure.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/infra/docker/alertmanager:/etc/alertmanager:ro \
            --entrypoint amtool \
            prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml


  validate-sql:
    name: Validate SQL schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files exist and are non-empty
        run: |
          test -s db/postgres/migrations/001_init.sql || (echo "PostgreSQL schema is empty!" && exit 1)
          test -s db/timescale/hypertables/001_init.sql || (echo "TimescaleDB schema is empty!" && exit 1)
          echo "SQL files OK"

      - name: Basic SQL syntax check
        run: |
          grep -l "CREATE TABLE" db/postgres/migrations/001_init.sql || (echo "No CREATE TABLE found" && exit 1)
          grep -l "create_hypertable" db/timescale/hypertables/001_init.sql || (echo "No hypertable found" && exit 1)
          echo "SQL syntax check OK"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          ! grep -rn "password=" --include="*.yml" --include="*.yaml" infra/ | grep -v '${' | grep -v '#'
          echo "No hardcoded secrets found"
      - name: Ensure .env is not tracked
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo ".env file is tracked by git!"
            exit 1
          fi
          echo ".env is not tracked - OK"


  deploy:
    name: Deploy to Hetzner
    needs: [validate-infra, validate-sql, security-scan]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Pull latest changes
        working-directory: /home/pavlin/wiser-repo
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply changes
        working-directory: /home/pavlin/wiser-repo/infra/docker
        run: |
          docker compose up -d --remove-orphans
          echo "Deployment complete"

      - name: Show running containers
        run: docker ps --format "table {{.Names}}\t{{.Status}}"
