server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /effis-wms/ {
        rewrite ^/effis-wms(.*)$ /effis$1 break;

        proxy_pass https://maps.effis.emergency.copernicus.eu;

        proxy_set_header Host maps.effis.emergency.copernicus.eu;
        proxy_set_header Referer "https://forest-fire.emergency.copernicus.eu/";
        proxy_set_header User-Agent "Mozilla/5.0";

        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache_valid 200 1h;
        proxy_cache_valid any 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
