server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /effis-wms/ {
        proxy_pass https://maps.effis.emergency.copernicus.eu/effis/;
        proxy_ssl_server_name on;
        proxy_set_header Host maps.effis.emergency.copernicus.eu;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
