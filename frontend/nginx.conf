server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # nginx builds redirect Locations from $scheme, and $scheme here is http: TLS ends at
    # Azure's edge and the container is only ever spoken to over plain HTTP. So an absolute
    # redirect sent an https page to http://fire-cast.com/..., which CSP's connect-src
    # 'self' then blocked - the fetch failed before it could be followed. Relative
    # Locations inherit the browser's scheme and cannot introduce that downgrade.
    # Harmless on Compose, where scheme and page already agree.
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # worker-src carries both kinds of worker: MapLibre builds its tile workers from blob:
    # URLs, and the service worker is a real file at /sw.js. Only blob: was listed, so
    # registering /sw.js was refused outright and the app had no service worker at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://maps.effis.emergency.copernicus.eu https://server.arcgisonline.com https://demotiles.maplibre.org https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://s3.amazonaws.com; connect-src 'self' https://maps.effis.emergency.copernicus.eu https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://demotiles.maplibre.org https://s3.amazonaws.com https://api.open-meteo.com https://api.bigdatacloud.net; worker-src 'self' blob:; frame-ancestors 'none';" always;

    # api's own ingress became external on Azure (see modules/container-apps/variables.tf)
    # and its edge adds response headers of its own on top of Spring's - together they
    # blew past nginx's 4k default and every /api/ response was failing with "upstream
    # sent too big header", not anything about the response body.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # No trailing slash: the map's protocol handler (use-map-init.ts) fetches
    # "/effis-wms?SERVICE=..." with none. Against `location /effis-wms/` that missed the
    # prefix and nginx answered 301 to the slashed form, which the browser refused (see
    # absolute_redirect above) - every EFFIS tile failed while curl, which follows
    # redirects, looked perfectly healthy. Matching the URL the app actually requests
    # removes the redirect rather than making it survivable.
    location /effis-wms {
        rewrite ^/effis-wms(.*)$ /effis$1 break;

        proxy_pass https://maps.effis.emergency.copernicus.eu;

        proxy_set_header Host maps.effis.emergency.copernicus.eu;
        proxy_set_header Referer "https://forest-fire.emergency.copernicus.eu/";
        proxy_set_header User-Agent "Mozilla/5.0";

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # proxy_ssl_verify изисква изричен CA bundle — без него nginx не стартира
        # ([emerg] no proxy_ssl_trusted_certificate). Alpine системния bundle:
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Must stay above the generic /api/ block. Buffering would hold events back until
    # the buffer filled, and the default read timeout would drop the idle connection.
    location = /api/v1/fires/stream {
        proxy_pass http://wiser-backend:8080/api/v1/fires/stream;

        # No-op on Compose (proxy_pass is http:// there). On Azure the entrypoint rewrites
        # the upstream to https:// - and Container Apps' environment-wide TLS listener is
        # multi-tenant, routing by SNI to pick which app answers. Without this, nginx sends
        # no SNI by default and the handshake gets reset before any HTTP response.
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends to whatever X-Forwarded-For came in - on
        # Compose that's always empty. On Azure the incoming header from the platform's
        # own edge kept growing across otherwise-unrelated requests, past nginx's response
        # buffer and into "upstream sent too big header". Set it outright instead of
        # appending, so what we send api can't inherit that growth.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://wiser-backend:8080/api/;
        proxy_ssl_server_name on;

        # Without this nginx proxies upstream on HTTP/1.0 by default. Azure's edge in
        # front of api's (now external) ingress just never answered a 1.0 request - not
        # an error, a silent hang until proxy_read_timeout. Compose never hit this because
        # a plain Docker network hop tolerates 1.0 fine.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Slashless for the same reason as /effis-wms above - this is where the GHSL human
    # settlement layer comes from, and it failed identically.
    location /gwis-wms {
        rewrite ^/gwis-wms(.*)$ /gwis$1 break;

        proxy_pass https://ies-ows.jrc.ec.europa.eu;

        proxy_set_header Host ies-ows.jrc.ec.europa.eu;
        proxy_set_header Referer "https://gwis.jrc.ec.europa.eu/";
        proxy_set_header User-Agent "Mozilla/5.0";

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything under /assets/ carries a build hash in its filename, so it is immutable -
    # and for the same reason it must never fall through to index.html. The catch-all
    # below used to answer a vanished name (an older build's bundle) with index.html and
    # a 200; the browser then got a <script type="module"> whose MIME was text/html,
    # refused it under strict MIME checking, and rendered a blank page while every server
    # log stayed clean. A plain 404 here makes that failure visible instead of disguising
    # it as success. `expires` is used rather than add_header on purpose: add_header in a
    # nested location discards the inherited server-level ones, CSP included.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        # index.html and sw.js are what point at those hashed names, so they have to be
        # revalidated on every load - a stale copy of either recreates the failure above.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
