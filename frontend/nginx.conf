server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://maps.effis.emergency.copernicus.eu https://server.arcgisonline.com https://demotiles.maplibre.org https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://s3.amazonaws.com; connect-src 'self' https://maps.effis.emergency.copernicus.eu https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com https://demotiles.maplibre.org https://s3.amazonaws.com https://api.open-meteo.com; worker-src blob:; frame-ancestors 'none';" always;

    # api's own ingress became external on Azure (see modules/container-apps/variables.tf)
    # and its edge adds response headers of its own on top of Spring's - together they
    # blew past nginx's 4k default and every /api/ response was failing with "upstream
    # sent too big header", not anything about the response body.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    location /effis-wms/ {
        rewrite ^/effis-wms(.*)$ /effis$1 break;

        proxy_pass https://maps.effis.emergency.copernicus.eu;

        proxy_set_header Host maps.effis.emergency.copernicus.eu;
        proxy_set_header Referer "https://forest-fire.emergency.copernicus.eu/";
        proxy_set_header User-Agent "Mozilla/5.0";

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # proxy_ssl_verify изисква изричен CA bundle — без него nginx не стартира
        # ([emerg] no proxy_ssl_trusted_certificate). Alpine системния bundle:
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Must stay above the generic /api/ block. Buffering would hold events back until
    # the buffer filled, and the default read timeout would drop the idle connection.
    location = /api/v1/fires/stream {
        proxy_pass http://wiser-backend:8080/api/v1/fires/stream;

        # No-op on Compose (proxy_pass is http:// there). On Azure the entrypoint rewrites
        # the upstream to https:// - and Container Apps' environment-wide TLS listener is
        # multi-tenant, routing by SNI to pick which app answers. Without this, nginx sends
        # no SNI by default and the handshake gets reset before any HTTP response.
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://wiser-backend:8080/api/;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gwis-wms/ {
        rewrite ^/gwis-wms(.*)$ /gwis$1 break;

        proxy_pass https://ies-ows.jrc.ec.europa.eu;

        proxy_set_header Host ies-ows.jrc.ec.europa.eu;
        proxy_set_header Referer "https://gwis.jrc.ec.europa.eu/";
        proxy_set_header User-Agent "Mozilla/5.0";

        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
