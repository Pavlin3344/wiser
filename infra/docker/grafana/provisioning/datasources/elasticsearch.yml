apiVersion: 1

# Логовете се гледаха само в Kibana, а метриките само в Grafana - две табла за един въпрос
# ("защо това число падна?"). С този datasource панел с логове застава до графиката, която
# го е повдигнала.
#
# Kibana остава: тя е по-добра за ровене и за data views. Това е за корелация.
datasources:
  - name: Elasticsearch
    type: elasticsearch
    uid: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    # Един индекс на ден за всички услуги, service е поле. Виж logstash/pipeline/wiser.conf
    # за причината старата схема (по индекс на услуга на ден) да бъде изоставена.
    database: "wiser-logs-*"
    isDefault: false
    editable: false
    jsonData:
      index: "wiser-logs-*"
      timeField: "@timestamp"
      esVersion: "8.13.0"
      # НЯМА `interval` тук, и това е нарочно. В този datasource `interval` не е честота,
      # а шаблон за ротация на индекси: с `interval: Daily` Grafana чете името на индекса
      # като формат за дата (w = седмица, s = секунди, e = ден от седмицата...) и пита
      # за индекс, който не съществува. Всеки панел върху ES гърмеше с "No data" и
      # червен триъгълник, докато Prometheus панелите до тях работеха - първото табло,
      # което изобщо ползва този datasource (wiser-azure.json, 9 септември), го показа.
      # Wildcard индексът върши цялата работа сам.
      #
      # timeInterval е минималната стъпка на заявката и съвпада с index.refresh_interval
      # в wiser-logs-template.json - по-кратка само би карала Grafana да пита за данни,
      # които още не са търсими.
      timeInterval: "10s"
      maxConcurrentShardRequests: 5
      logMessageField: message
      logLevelField: log_level
