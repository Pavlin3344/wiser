apiVersion: 1

# Заменя Alerta UI — алармите от Prometheus/Alertmanager се гледат
# в Grafana → Alerting → Alertmanager datasource.
datasources:
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
