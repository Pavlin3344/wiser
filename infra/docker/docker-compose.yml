# Log rotation по подразбиране — без нея json логовете на Docker растат безкрайно.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: wiser-postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: wiser
      POSTGRES_USER: wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiser -d wiser"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Миграциите се прилагат от Flyway (вместо /docker-entrypoint-initdb.d,
  # който работи само при празен volume). Файловете са в db/postgres/migrations
  # с Flyway naming: V1__init.sql, V2__xxx.sql...
  flyway-postgres:
    image: flyway/flyway:11-alpine
    container_name: wiser-flyway-postgres
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/wiser
      FLYWAY_USER: wiser
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "30"
      # Съществуваща база (инициализирана преди Flyway) се baseline-ва на V1,
      # така че V1__init.sql не се прилага повторно върху нея.
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    command: migrate
    volumes:
      - ../../db/postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  timescale:
    image: timescale/timescaledb:2.28.1-pg16
    container_name: wiser-timescale
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: wiser_timeseries
      POSTGRES_USER: wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiser -d wiser_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  flyway-timescale:
    image: flyway/flyway:11-alpine
    container_name: wiser-flyway-timescale
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://timescale:5432/wiser_timeseries
      FLYWAY_USER: wiser
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    command: migrate
    volumes:
      - ../../db/timescale/hypertables:/flyway/sql:ro
    depends_on:
      timescale:
        condition: service_healthy
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: wiser-minio
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "100.116.156.92:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: wiser-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wiser http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb wiser/satellite-imagery --ignore-existing;
      mc mb wiser/processed-products --ignore-existing;
      echo 'MinIO buckets ready.';
      "
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wiser-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: wiser
    ports:
      - "127.0.0.1:5672:5672"
      - "100.116.156.92:15672:15672"
      - "100.116.156.92:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    # load_definitions makes RabbitMQ skip creating RABBITMQ_DEFAULT_USER, and
    # definitions.json deliberately carries no credentials (they would be a password
    # hash in git). The broker therefore boots with no users at all and every client
    # gets ACCESS_REFUSED. This seeds the user once the broker is up.
    # Runs inside the broker container on purpose: a sidecar would need a shared Erlang
    # cookie and a fixed node name, and pinning the hostname would orphan the existing
    # mnesia directory.
    command:
      - sh
      - -c
      - |
        (
          until rabbitmqctl await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl list_users 2>/dev/null | grep -qx "$$RABBITMQ_DEFAULT_USER.*" \
            || rabbitmqctl add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" \
            || rabbitmqctl change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl set_permissions -p "$$RABBITMQ_DEFAULT_VHOST" "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
          echo "RabbitMQ user provisioning done."
        ) &
        exec rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  wiser-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: wiser-frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  wiser-backend:
    build:
      context: ../../backend/api
      dockerfile: Dockerfile
    container_name: wiser-backend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WISER_API_KEY: ${WISER_API_KEY}
      # Air quality and FWI are time series, kept in TimescaleDB.
      TIMESCALE_URL: jdbc:postgresql://timescale:5432/wiser_timeseries
      # Consumes fire.detections and fans it out to dashboards over SSE.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
      timescale:
        condition: service_healthy
      flyway-timescale:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:81:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  wiser-alerts:
    build:
      context: ../../backend/alerts
      dockerfile: Dockerfile
    container_name: wiser-alerts
    restart: unless-stopped
    mem_limit: 384m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WISER_API_KEY: ${WISER_API_KEY}
      ALERTS_NOTIFY_ENABLED: ${ALERTS_NOTIFY_ENABLED:-false}
      ALERTS_NOTIFY_TO: ${ALERTS_NOTIFY_TO:-}
      ALERTS_NOTIFY_FROM: ${ALERTS_NOTIFY_FROM:-wiser@wisertech.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  wiser-ingestion:
    build:
      context: ../../backend/ingestion
      dockerfile: Dockerfile
    container_name: wiser-ingestion
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WISER_API_KEY: ${WISER_API_KEY}
      # Air quality readings are written to TimescaleDB, not the PostGIS database.
      TIMESCALE_URL: jdbc:postgresql://timescale:5432/wiser_timeseries
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET}
      OSM_IMPORT_SCHEDULED: ${OSM_IMPORT_SCHEDULED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
      timescale:
        condition: service_healthy
      flyway-timescale:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Python workers. FWI and NDVI are long-lived RabbitMQ consumers; fuel is a one-time
  # bootstrap kept in docker-compose.jobs.yml so it does not hold memory on a RAM-tight
  # host.
  worker-fwi:
    build:
      context: ../../data/processing
      dockerfile: Dockerfile
      args:
        WORKER: fwi
    container_name: wiser-worker-fwi
    restart: unless-stopped
    mem_limit: 192m
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TIMESCALE_HOST: timescale
      TIMESCALE_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescale:
        condition: service_healthy
      flyway-timescale:
        condition: service_completed_successfully
    logging: *default-logging

  worker-ndvi:
    build:
      context: ../../data/processing
      dockerfile: Dockerfile
      args:
        WORKER: ndvi
    container_name: wiser-worker-ndvi
    restart: unless-stopped
    # Highest limit of the workers: rasterio/numpy hold whole Sentinel-2 bands in memory.
    mem_limit: 768m
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  # Phase 3: burn severity (dNBR) after a fire. Event-driven, not scheduled - it only
  # works when something publishes a pre/post scene pair to `analysis.tasks`, so it sits
  # idle most of the time. Memory sized for the peak: two Sentinel-2 bands per scene.
  worker-dnbr:
    build:
      context: ../../data/processing
      dockerfile: Dockerfile
      args:
        WORKER: dnbr
    container_name: wiser-worker-dnbr
    restart: unless-stopped
    mem_limit: 768m
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    logging: *default-logging

  # Rebuilds the `zones` table from FWI + NDVI + fuel. This used to be a one-shot job
  # driven by host cron - but that cron lived outside the repository, was never set up,
  # and `zones` stayed empty while every input was being collected correctly. Scheduling
  # it inside the container keeps the daily rhythm declared next to the thing it runs.
  #
  # Between runs the process is a sleeping Python interpreter (tens of MB); the limit is
  # sized for the peak, when rasterio holds the NDVI and fuel bands in memory.
  #
  # One-off run (backfill, or after changing the model):
  #   docker compose run --rm -e RISK_ZONES_INTERVAL_SECONDS=0 risk-zones
  risk-zones:
    build:
      context: ../../data/processing
      dockerfile: Dockerfile
      args:
        WORKER: risk_zones
        ENTRYPOINT_FILE: job.py
    container_name: wiser-risk-zones
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TIMESCALE_HOST: timescale
      TIMESCALE_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # EFFIS publishes FWI once a day, but the container cannot know at which hour that
      # lands, so it re-checks every six hours rather than waiting out a full day.
      RISK_ZONES_INTERVAL_SECONDS: "21600"
    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
      timescale:
        condition: service_healthy
      flyway-timescale:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    logging: *default-logging

  # Prometheus scrapes the Java services through actuator; the three Python workers have
  # no such endpoint, and a running container proves nothing anyway - `zones` sat empty
  # for weeks while every container was up and green. This exporter reports the freshness
  # of what the workers produce, which is the signal that actually matters.
  #
  # Read-only: it queries both databases and lists MinIO, and writes nothing.
  data-metrics:
    build:
      context: ../../data/processing
      dockerfile: Dockerfile
      args:
        WORKER: metrics
        ENTRYPOINT_FILE: exporter.py
    container_name: wiser-data-metrics
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TIMESCALE_HOST: timescale
      TIMESCALE_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      flyway-postgres:
        condition: service_completed_successfully
      timescale:
        condition: service_healthy
      flyway-timescale:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: wiser-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging: *default-logging

  cadvisor:
    # v0.55.1: съдържа фикса за Docker containerd image store (google/cadvisor
    # PR #3709) — v0.49 не можеше да регистрира контейнерите изобщо
    # ("failed to identify the read-write layer ID", image/overlayfs layerdb).
    # v0.53 няма публикуван image; v0.54.1 е първият с фикса.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: wiser-cadvisor
    restart: unless-stopped
    mem_limit: 256m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # Само Docker контейнери (без raw systemd cgroups — по-малко RAM/CPU и шум)
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      # Per-container disk метрики не ползваме (host disk идва от node-exporter);
      # останалите в списъка са default-disabled — изредени изрично.
      - '--disable_metrics=disk,diskIO,percpu,advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp'
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: wiser-postgres-exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DATA_SOURCE_NAME: "postgresql://wiser:${POSTGRES_PASSWORD}@postgres:5432/wiser?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wiser-prometheus
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "100.116.156.92:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    container_name: wiser-grafana
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "100.116.156.92:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wiser-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: wiser-elasticsearch
    restart: unless-stopped
    mem_limit: 2g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: wiser-logstash
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    # Без публикуван порт — filebeat говори с logstash:5044 през docker мрежата.
    # 0.0.0.0:5044 беше отворен beats endpoint към интернет.
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: wiser-kibana
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "100.116.156.92:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: wiser-filebeat
    restart: unless-stopped
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

volumes:
  postgres_data:
  timescale_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
