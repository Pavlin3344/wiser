# ================================================================
# Локален dev стек — само data услугите за Фаза 1.
# Всички портове на 127.0.0.1 (без Tailscale IP-та на сървъра).
# Image версиите са пиннати 1:1 с продъкшън docker-compose.yml.
# Употреба (от onboarding.md):
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
# ================================================================
services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: wiser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiser
      POSTGRES_USER: wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Миграциите се прилагат от Flyway (V1__init.sql, V2__xxx.sql...),
  # както на сървъра — вместо /docker-entrypoint-initdb.d.
  flyway-postgres:
    image: flyway/flyway:11-alpine
    container_name: wiser-flyway-postgres
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/wiser
      FLYWAY_USER: wiser
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    command: migrate
    volumes:
      - ../../db/postgres/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  timescale:
    image: timescale/timescaledb:2.28.1-pg16
    container_name: wiser-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiser_timeseries
      POSTGRES_USER: wiser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiser"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway-timescale:
    image: flyway/flyway:11-alpine
    container_name: wiser-flyway-timescale
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://timescale:5432/wiser_timeseries
      FLYWAY_USER: wiser
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "30"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    command: migrate
    volumes:
      - ../../db/timescale/hypertables:/flyway/sql:ro
    depends_on:
      timescale:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: wiser-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: wiser-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wiser http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb wiser/satellite-imagery --ignore-existing;
      mc mb wiser/processed-products --ignore-existing;
      echo 'MinIO buckets ready.';
      "

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wiser-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: wiser
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # Definitions вече не съдържат users (креденшълите идват от env),
      # затова prod и dev споделят един файл.
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  timescale_data:
  minio_data:
  rabbitmq_data:
