input {
  beats {
    port => 5044
  }
}

filter {
  if [service] {
    mutate {
      add_field => { "[@metadata][index]" => "wiser-%{[service]}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index]" => "wiser-general" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
