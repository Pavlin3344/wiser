input {
  # Hetzner: filebeat чете docker json логовете на хоста и ги праща по docker мрежата.
  beats {
    port => 5044
    add_field => { "origin" => "hetzner" }
  }

  # Azure: Container Apps няма host, от който да се чете нищо - приложенията пращат сами
  # по TCP през Tailscale (Logback appender в Java, log_shipper.py в Python). json_lines
  # чака по един JSON обект на ред, точно каквото двата изпращача произвеждат.
  #
  # ВАЖНО: това НЕ може да е порт 5044. Beats входът говори Lumberjack, не обикновен TCP -
  # Logback се свързва успешно и после бива отрязан, което изглежда като мрежов проблем.
  tcp {
    port => 5045
    codec => json_lines
    add_field => { "origin" => "azure" }
  }
}

filter {
  # Само за beats входа: service идва от Docker compose label. Container Apps не праща
  # такъв label, затова оттам service идва наготово в самия JSON.
  if [container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "service" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  # Класифицираме сервизите по категории
  if [service] in ["postgres", "timescale"] {
    mutate { add_field => { "category" => "database" } }
  } else if [service] in ["rabbitmq", "minio", "minio-init"] {
    mutate { add_field => { "category" => "messaging-storage" } }
  } else if [service] in ["prometheus", "grafana", "alertmanager", "node-exporter", "cadvisor", "postgres-exporter", "data-metrics"] {
    mutate { add_field => { "category" => "observability-metrics" } }
  } else if [service] in ["elasticsearch", "logstash", "kibana", "filebeat"] {
    mutate { add_field => { "category" => "observability-logs" } }
  } else if [service] in ["wiser-backend", "wiser-alerts", "wiser-ingestion", "wiser-frontend"] {
    mutate { add_field => { "category" => "application" } }
  } else if [service] in ["worker-fwi", "worker-ndvi", "worker-dnbr", "risk-zones", "fuel-loader"] {
    mutate { add_field => { "category" => "data-processing" } }
  } else {
    mutate { add_field => { "category" => "other" } }
  }

  # Log level от текста на съобщението. Java-та праща level като поле, затова се прескача,
  # ако вече е попълнено - иначе grok-ът би хванал думата ERROR в средата на изречение.
  if ![log_level] {
    grok {
      match => { "message" => "(?i)(?<log_level>ERROR|WARN|WARNING|INFO|DEBUG|FATAL|CRITICAL)" }
      tag_on_failure => []
    }
  }

  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }

  # ВАЖНО: remove_field в КРАЯ, след като сме използвали полетата
  mutate {
    remove_field => [
      "agent",
      "ecs",
      "host",
      "[container][labels]",
      "[container][image]",
      "input",
      "[log][file]",
      "[log][offset]",
      "stream",
      "tags"
    ]
  }
}

output {
  # Един индекс на ден за всичко, а service е поле - не част от името.
  #
  # Досега схемата беше wiser-%{service}-YYYY.MM.dd, тоест по един индекс на услуга на ден:
  # ~20 дневно, 481 за три месеца, за общо 649 MiB данни. При 1 GB heap Elasticsearch
  # държеше 519 активни shard-а - Elastic препоръчва ~20 на гигабайт heap. Kibana филтрира
  # по поле точно толкова добре, колкото по име на индекс, така че разликата беше чиста
  # загуба.
  #
  # number_of_replicas е 0 през шаблона (elasticsearch/wiser-logs-template.json): клъстерът
  # е един node, значи всяка реплика е неразпределима по дефиниция - оттам идваха 481
  # unassigned shard-а и вечният yellow статус.
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "wiser-logs-%{+YYYY.MM.dd}"
  }
}
