input {
  # Hetzner: filebeat чете docker json логовете на хоста и ги праща по docker мрежата.
  beats {
    port => 5044
    add_field => { "origin" => "hetzner" }
  }

  # Azure: Container Apps няма host, от който да се чете нищо - приложенията пращат сами
  # по TCP през Tailscale (Logback appender в Java, log_shipper.py в Python). json_lines
  # чака по един JSON обект на ред, точно каквото двата изпращача произвеждат.
  #
  # ВАЖНО: това НЕ може да е порт 5044. Beats входът говори Lumberjack, не обикновен TCP -
  # Logback се свързва успешно и после бива отрязан, което изглежда като мрежов проблем.
  tcp {
    port => 5045
    codec => json_lines
    add_field => { "origin" => "azure" }
  }
}

filter {
  # Само за beats входа: service идва от Docker compose label. Container Apps не праща
  # такъв label, затова оттам service идва наготово в самия JSON.
  if [container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "service" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  # frontend е nginx и пише в стандартния "main" формат на официалния образ: combined
  # плюс $http_x_forwarded_for накрая. През моста редовете идват като чист текст - тук
  # стават полета, за да е "покажи ми петстотиците" агрегация, а не търсене на подниз.
  # tag_on_failure вместо мълчание: ако форматът се смени, това трябва да се вижда в
  # Kibana, а не да изглежда като че ли трафикът е спрял.
  if [service] == "frontend" and [logger] == "container-console" {
    grok {
      match => {
        "message" => "%{IPORHOST:[http][client_ip]} - %{DATA:[http][user]} \[%{HTTPDATE:[http][time]}\] \"%{WORD:[http][method]} %{DATA:[http][path]} HTTP/%{NUMBER:[http][version]}\" %{INT:[http][status]:int} %{INT:[http][bytes]:int} \"%{DATA:[http][referrer]}\" \"%{DATA:[http][user_agent]}\" \"%{DATA:[http][forwarded_for]}\""
      }
      tag_on_failure => ["_nginx_grok_failure"]
    }

    # Статусът е нивото. Без това всеки ред на nginx е без log_level (в текста няма
    # дума ERROR), тоест филтърът по ниво в Kibana не вижда нито един провален request.
    if [http][status] {
      if [http][status] >= 500 {
        mutate { add_field => { "log_level" => "ERROR" } }
      } else if [http][status] >= 400 {
        mutate { add_field => { "log_level" => "WARN" } }
      } else {
        mutate { add_field => { "log_level" => "INFO" } }
      }
    }
  }

  # Класифицираме сервизите по категории
  #
  # Имената идват от два свята и двата са изброени тук нарочно. Compose-ските
  # (wiser-backend, wiser-ingestion...) остават, защото стекът се вдига обратно с един
  # env var и логовете му трябва да попаднат в същите категории. Azure-ските са ключовете
  # на Container App-овете и job-овете - `service` идва или от WISER_LOG_SERVICE в самия
  # процес, или от ContainerName_s през моста, и двете дават едно и също име.
  if [service] in ["postgres", "timescale"] {
    mutate { add_field => { "category" => "database" } }
  } else if [service] in ["rabbitmq", "minio", "minio-init"] {
    mutate { add_field => { "category" => "messaging-storage" } }
  } else if [service] in ["prometheus", "grafana", "alertmanager", "node-exporter", "cadvisor", "postgres-exporter", "data-metrics"] {
    mutate { add_field => { "category" => "observability-metrics" } }
  } else if [service] in ["elasticsearch", "logstash", "kibana", "filebeat", "azure-log-bridge"] {
    mutate { add_field => { "category" => "observability-logs" } }
  } else if [service] in ["wiser-backend", "wiser-alerts", "wiser-ingestion", "wiser-frontend",
                          "api", "alerts", "frontend",
                          "ingest-effis", "ingest-firms", "ingest-air-quality",
                          "ingest-sentinel", "ingest-osm"] {
    mutate { add_field => { "category" => "application" } }
  } else if [service] in ["worker-fwi", "worker-ndvi", "worker-dnbr", "risk-zones",
                          "fuel-loader", "dnbr-scene-fetcher", "roads-import"] {
    mutate { add_field => { "category" => "data-processing" } }
  } else if [service] == "container-apps" {
    # Системно събитие, което не се отнася за конкретен ресурс (нивото на средата).
    mutate { add_field => { "category" => "platform" } }
  } else {
    mutate { add_field => { "category" => "other" } }
  }

  # Log level от текста на съобщението. Java-та праща level като поле, затова се прескача,
  # ако вече е попълнено - иначе grok-ът би хванал думата ERROR в средата на изречение.
  if ![log_level] {
    grok {
      match => { "message" => "(?i)(?<log_level>ERROR|WARN|WARNING|INFO|DEBUG|FATAL|CRITICAL)" }
      tag_on_failure => []
    }
  }

  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }

  # Grok-ът по-горе е case-insensitive и връща думата както е написана в текста, тоест
  # minio даваше "Error", а Java - "ERROR". За keyword поле това са две различни
  # стойности: филтърът за грешки в Kibana хващаше едните и подминаваше другите.
  if [log_level] {
    mutate { uppercase => ["log_level"] }
  }

  # Ред без разпознато ниво досега нямаше поле log_level изобщо, тоест филтърът по ниво
  # в Kibana мълчаливо скриваше и него. INFO е честният вариант по подразбиране: това
  # твърди само, че нищо не се е представило като по-лошо.
  if ![log_level] {
    mutate { add_field => { "log_level" => "INFO" } }
  }

  # ВАЖНО: remove_field в КРАЯ, след като сме използвали полетата.
  #
  # Първата група е шум независимо откъде идва редът: filebeat закача agent/ecs/input/
  # offset-и, а входовете добавят `host` (за tcp входа - IP-то на router-а, едно и също
  # за всичко от Azure).
  mutate {
    remove_field => [
      "agent",
      "ecs",
      "host",
      "[container][labels]",
      "[container][image]",
      "input",
      "[log][file]",
      "[log][offset]"
    ]
  }

  # Тези двете обаче само filebeat ги пълни с шум. От Azure `stream` е stdout/stderr на
  # контейнера - истинска информация, а в `tags` стои `_nginx_grok_failure`, тоест
  # диагностика, която трябва да стигне до Kibana, а не да бъде изметена с чуждия шум.
  if [origin] == "hetzner" {
    mutate {
      remove_field => ["stream", "tags"]
    }
  }

  # Идемпотентност за реда, дошъл през моста. Log Analytics показва ред със забава, така
  # че мостът чете със застъпване и нарочно подава едно и също нещо повторно - същото
  # правило като при базите (CLAUDE.md: всеки писач трябва да е идемпотентен), само че
  # ролята на уникалния индекс тук я играе _id-то на документа.
  #
  # Времето само по себе си не стига: nginx лесно обслужва два request-а в една и съща
  # милисекунда. Затова в отпечатъка влизат и репликата, и целият текст на реда.
  if [via] == "log-analytics" {
    fingerprint {
      source => ["@timestamp", "service", "replica", "message"]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][doc_id]"
    }
  }
}

output {
  # Един индекс на ден за всичко, а service е поле - не част от името.
  #
  # Досега схемата беше wiser-%{service}-YYYY.MM.dd, тоест по един индекс на услуга на ден:
  # ~20 дневно, 481 за три месеца, за общо 649 MiB данни. При 1 GB heap Elasticsearch
  # държеше 519 активни shard-а - Elastic препоръчва ~20 на гигабайт heap. Kibana филтрира
  # по поле точно толкова добре, колкото по име на индекс, така че разликата беше чиста
  # загуба.
  #
  # number_of_replicas е 0 през шаблона (elasticsearch/wiser-logs-template.json): клъстерът
  # е един node, значи всяка реплика е неразпределима по дефиниция - оттам идваха 481
  # unassigned shard-а и вечният yellow статус.
  #
  # Два изхода, защото само единият има какво да сложи за _id. Редовете, които процесите
  # пращат сами, идват веднъж и получават генериран _id; тези през моста носят свой
  # детерминиран, така че повторното подаване презаписва същия документ вместо да добави
  # втори. Без това всеки рестарт на моста щеше да остави половин час дубликати.
  if [via] == "log-analytics" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "wiser-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "wiser-logs-%{+YYYY.MM.dd}"
    }
  }
}
