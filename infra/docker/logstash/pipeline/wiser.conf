input {
  beats {
    port => 5044
  }
}

filter {
  # Извличаме service name от Docker compose label (правим го ПЪРВО, преди remove)
  if [container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "service" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  # Класифицираме сервизите по категории
  if [service] in ["postgres", "timescale"] {
    mutate { add_field => { "category" => "database" } }
  } else if [service] in ["rabbitmq", "minio", "minio-init"] {
    mutate { add_field => { "category" => "messaging-storage" } }
  } else if [service] in ["prometheus", "grafana", "alertmanager", "alerta", "alerta-mongo", "node-exporter", "cadvisor", "postgres-exporter"] {
    mutate { add_field => { "category" => "observability-metrics" } }
  } else if [service] in ["elasticsearch", "logstash", "kibana", "filebeat"] {
    mutate { add_field => { "category" => "observability-logs" } }
  } else {
    mutate { add_field => { "category" => "other" } }
  }

  # Извличаме log level от message
  grok {
    match => { "message" => "(?i)(?<log_level>ERROR|WARN|WARNING|INFO|DEBUG|FATAL|CRITICAL)" }
    tag_on_failure => []
  }

  # Index routing по service
  if [service] {
    mutate {
      add_field => { "[@metadata][index]" => "wiser-%{service}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index]" => "wiser-general" }
    }
  }

  # ВАЖНО: remove_field в КРАЯ, след като сме използвали полетата
  mutate {
    remove_field => [
      "agent",
      "ecs",
      "host",
      "[container][labels]",
      "[container][image]",
      "input",
      "[log][file]",
      "[log][offset]",
      "stream",
      "tags"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
