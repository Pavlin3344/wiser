groups:
  - name: backend
    rules:

      # Java сервиз не отговаря на scrape
      - alert: BackendServiceDown
        expr: up{job=~"wiser-backend|wiser-alerts|wiser-ingestion"} == 0
        for: 2m
        labels:
          severity: critical
          environment: Development
        annotations:
          summary: "Backend service down: {{ $labels.job }}"
          description: "{{ $labels.job }} has not responded to scrapes for 2 minutes"

      # 5xx над 5% от заявките
      - alert: BackendHighErrorRate
        expr: |
          sum by(job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by(job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          environment: Development
        annotations:
          summary: "High 5xx rate on {{ $labels.job }}"
          description: "{{ $value | printf \"%.1f\" }}% of requests are failing with 5xx"

      # FIRMS ключът не е конфигуриран — ingestion работи, но не внася нищо.
      # Без този alert празната карта изглежда като "няма пожари".
      - alert: FirmsIngestionNotConfigured
        expr: wiser_ingestion_firms_configured == 0
        for: 15m
        labels:
          severity: critical
          environment: Development
        annotations:
          summary: "FIRMS API key is not configured"
          description: "Fire ingestion is running but cannot fetch detections - set FIRMS_MAP_KEY"

      # JVM heap над 90% от максимума
      - alert: BackendHighHeapUsage
        expr: |
          sum by(job) (jvm_memory_used_bytes{area="heap"})
            / sum by(job) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
          environment: Development
        annotations:
          summary: "High JVM heap usage on {{ $labels.job }}"
          description: "Heap is {{ $value | printf \"%.0f\" }}% full - container may be OOM-killed"
