global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Spring Boot services expose Micrometer metrics on the actuator path rather than
  # the Prometheus default of /metrics.
  - job_name: 'wiser-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-backend:8080']

  - job_name: 'wiser-alerts'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-alerts:8082']

  - job_name: 'wiser-ingestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-ingestion:8081']
