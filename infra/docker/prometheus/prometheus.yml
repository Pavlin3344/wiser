global:
  # 30s, not 15s. Nothing here changes faster than hourly - EFFIS publishes once a day,
  # FIRMS is polled hourly, the risk batch runs every six hours - so a 15s scrape doubled
  # the sample count to describe data that had not moved. On Azure Monitor's managed
  # Prometheus, which bills per ingested sample, that difference is the whole bill.
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Spring Boot services expose Micrometer metrics on the actuator path rather than
  # the Prometheus default of /metrics.
  - job_name: 'wiser-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-backend:8080']

  - job_name: 'wiser-alerts'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-alerts:8082']

  - job_name: 'wiser-ingestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wiser-ingestion:8081']

  # The Python workers have no actuator equivalent, so a small exporter reports the
  # freshness of what they produce (zones, FWI rows, NDVI rasters) instead.
  - job_name: 'wiser-data-metrics'
    # Every scrape opens a connection to both databases and lists MinIO, and freshness
    # moves on the scale of hours - the global 15s would be four times a minute for
    # nothing. The alerts here are all measured in hours, so a minute of lag is free.
    scrape_interval: 60s
    static_configs:
      - targets: ['data-metrics:9105']
